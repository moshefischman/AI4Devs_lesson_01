[project]
name = "reviewer"
version = "0.1.0"
description = "AI Code Reviewer: structured code review powered by Claude"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = [
    "live: calls the real Claude API and spends credit; run only with explicit approval",
]

[tool.coverage.run]
source = ["reviewer"]

[tool.ruff]
line-length = 100
target-version = "py310"
# The numbered lesson scripts (10-messages.py, ...) predate the reviewer package.
extend-exclude = ["venv", "tests/fixtures", "[0-9][0-9]-*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
